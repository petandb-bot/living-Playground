name: Verify first playable
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Musical behavior and visuals tests
        run: npm test
      - name: Source syntax checks
        run: npm run check
      - name: Build static application
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: living-playground-alpha
          path: dist/
          retention-days: 14
